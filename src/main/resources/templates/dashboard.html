<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org", xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Expense Dashboard - Expense Tracker</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        h1 {
            color: #333;
        }
        .btn {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: none;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"],
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .actions button {
            margin-right: 5px;
            padding: 5px 10px;
            font-size: 12px;
        }
        #admin-link {
            display: none;
        }
    </style>
</head>
<body>
<!-- dashboard.html -->
<div sec:authorize="hasRole('ADMIN')">
    <script>
        // Automatically redirect to admin (optional)
        window.location.href = '/admin';
    </script>
    <a href="/admin" class="btn">Go to Admin Panel</a>
</div>
<div class="container">
    <header>
        <h1>Your Expenses</h1>
        <div>
            <button class="btn" onclick="loadExpenses()">Refresh</button>
            <button class="btn btn-success" onclick="showAddForm()">Add Expense</button>
            <a href="/api/expenses/report" class="btn" download>Download Report (CSV)</a>
            <form method="post" action="/logout" style="display:inline;">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <button type="submit" class="btn">Logout</button>
            </form>
            <a id="admin-link" href="/admin" class="btn">Admin Panel</a>
        </div>
    </header>

    <div id="expense-form" class="form-container">
        <h3 id="form-title">Add New Expense</h3>
        <form id="expenseForm">
            <input type="hidden" id="expense-id" />
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" step="0.01" min="0.01" required />
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" required />
            </div>
            <div class="form-group">
                <label for="expense-date">Date:</label>
                <input type="date" id="expense-date" required />
            </div>
            <div class="form-group">
                <label for="description">Description (optional):</label>
                <input type="text" id="description" />
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn" onclick="hideForm()">Cancel</button>
        </form>
    </div>

    <table id="expenses-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="expenses-list">
        <!-- Expenses will be loaded here -->
        </tbody>
    </table>

    <!-- Visual chart area -->
    <div id="charts-section" style="margin-top: 30px; display: none;">
        <h3>Expense Visualization</h3>
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px; height: 300px; position: relative;">
                <canvas id="categoryChart"></canvas>
            </div>
            <div style="flex: 1; min-width: 300px; height: 300px; position: relative;">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>


    function getCsrfToken() {
        const tokenMeta = document.querySelector('meta[name="_csrf"]');
        const headerMeta = document.querySelector('meta[name="_csrf_header"]');

        if (!tokenMeta || !headerMeta) {
            console.error("CSRF meta tags not found!");
            return { token: null, headerName: null };
        }

        const token = tokenMeta.getAttribute('content');
        const headerName = headerMeta.getAttribute('content');

        return { token, headerName };
    }
    const { token, headerName } = getCsrfToken();

    let currentExpenses = []; // Global variable, cache all expenses

    async function loadExpenses() {

        try {
            // Direct request, automatically authenticated by Cookie
            const response = await fetch('/api/expenses');

            if (response.status === 401 || response.status === 403) {
                // Unauthenticated or unauthorized → Redirect to log in
                window.location.href = '/login';
                return;
            }

            const expenses = await response.json();
            currentExpenses = expenses;
            const tbody = document.getElementById('expenses-list');
            tbody.innerHTML = '';

            if (expenses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No expenses found.</td></tr>';
                return;
            }

            expenses.forEach(expense => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(expense.id)}</td>
                    <td>$${parseFloat(expense.amount).toFixed(2)}</td>
                    <td>${escapeHtml(expense.category)}</td>
                    <td>${escapeHtml(expense.expenseDate)}</td>
                    <td>${expense.description ? escapeHtml(expense.description) : ''}</td>
                    <td class="actions">
                        <button class="btn edit-btn" data-id="${expense.id}">Edit</button>
<!--                        <button class="btn" onclick="editExpense(${expense.id}, ${JSON.stringify(expense).replace(/'/g, "\\'")})">Edit</button>-->
                        <button class="btn btn-danger" onclick="deleteExpense(${expense.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            renderCharts(expenses);
        } catch (error) {
            console.error('Error loading expenses:', error);
            alert('Failed to load expenses. Please try again.');
        }
    }

    function showAddForm() {
        document.getElementById('form-title').textContent = 'Add New Expense';
        document.getElementById('expense-id').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('description').value = '';
        document.getElementById('expense-form').style.display = 'block';
    }

    function hideForm() {
        document.getElementById('expense-form').style.display = 'none';
    }

    async function editExpense(id, expense) {
        document.getElementById('form-title').textContent = 'Edit Expense';
        document.getElementById('expense-id').value = id;
        document.getElementById('amount').value = expense.amount;
        document.getElementById('category').value = expense.category;
        document.getElementById('expense-date').value = expense.expenseDate;
        document.getElementById('description').value = expense.description || '';
        document.getElementById('expense-form').style.display = 'block';
    }

    async function deleteExpense(id) {
        if (!confirm('Are you sure you want to delete this expense?')) return;

        try {
            const response = await fetch(`/api/expenses/${id}`, {
                method: 'DELETE',
                headers: {
                    [headerName]: token
                }

            });

            if (response.ok) {
                loadExpenses();
            } else if (response.status === 401 || response.status === 403) {
                window.location.href = '/login';
            } else {
                alert('Failed to delete expense.');
            }
        } catch (error) {
            console.error('Delete error:', error);
            alert('Network error. Please try again.');
        }
    }

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const id = document.getElementById('expense-id').value;
        const expenseData = {
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value.trim(),
            expenseDate: document.getElementById('expense-date').value,
            description: document.getElementById('description').value.trim() || null
        };

        if (!expenseData.category || isNaN(expenseData.amount) || expenseData.amount <= 0) {
            alert('Please enter valid amount and category.');
            return;
        }

        try {
            let response;
            if (id) {
                // Update
                response = await fetch(`/api/expenses/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json',
                        [headerName]: token },
                    body: JSON.stringify(expenseData)
                });
            } else {
                // Create
                response = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json',
                            [headerName]: token},
                    body: JSON.stringify(expenseData)
                });
            }

            if (response.ok) {
                hideForm();
                loadExpenses();
            } else if (response.status === 401 || response.status === 403) {
                window.location.href = '/login';
            } else {
                const errorText = await response.text();
                alert('Operation failed: ' + (errorText || 'Unknown error'));
            }
        } catch (error) {
            console.error('Save error:', error);
            alert('Network error. Please try again.');
        }
    });

    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    let categoryChartInstance = null;
    let monthlyChartInstance = null;

    function renderCharts(expenses) {
        const chartsSection = document.getElementById('charts-section');
        if (expenses.length === 0) {
            chartsSection.style.display = 'none';
            return;
        }
        chartsSection.style.display = 'block';

        // --- 1. BY category ---
        const categoryMap = {};
        expenses.forEach(e => {
            const cat = e.category || 'Uncategorized';
            const amount = parseFloat(e.amount) || 0;
            categoryMap[cat] = (categoryMap[cat] || 0) + amount;
        });

        const categories = Object.keys(categoryMap);
        const categoryAmounts = categories.map(cat => categoryMap[cat]);

        // Destroy old instances (to avoid duplicate creation)
        if (categoryChartInstance) {
            categoryChartInstance.destroy();
        }

        const ctx1 = document.getElementById('categoryChart').getContext('2d');
        categoryChartInstance = new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: categories,
                datasets: [{
                    data: categoryAmounts,
                    backgroundColor: [
                        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                        '#FF9F40', '#FF6384', '#C9CBCF', '#4D5360', '#2ECC71'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.label}: $${context.raw.toFixed(2)}`;
                            }
                        }
                    }
                }
            }
        });

        // --- 2.by month ---
        const monthlyMap = {};
        expenses.forEach(e => {
            const d = new Date(e.expenseDate);
            if (isNaN(d.getTime())) return; // 跳过无效日期
            const yearMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const amount = parseFloat(e.amount) || 0;
            monthlyMap[yearMonth] = (monthlyMap[yearMonth] || 0) + amount;
        });

        const months = Object.keys(monthlyMap).sort();
        const monthlyAmounts = months.map(m => monthlyMap[m]);

        if (monthlyChartInstance) {
            monthlyChartInstance.destroy();
        }

        const ctx2 = document.getElementById('monthlyChart').getContext('2d');
        monthlyChartInstance = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Monthly Expenses ($)',
                    data: monthlyAmounts,
                    backgroundColor: '#36A2EB',
                    borderColor: '#2c8bd0',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '$' + value;
                            }
                        }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    window.onload = function() {
        loadExpenses();

    };

    // Event delegation: Uniformly handle all Edit and Delete button clicks
    document.getElementById('expenses-table').addEventListener('click', function(e) {
        if (e.target.classList.contains('edit-btn')) {
            const id = parseInt(e.target.getAttribute('data-id'));
            const expense = currentExpenses.find(exp => exp.id === id);
            if (expense) {
                editExpense(id, expense);
            }
        } else if (e.target.classList.contains('delete-btn')) {
            const id = parseInt(e.target.getAttribute('data-id'));
            deleteExpense(id);
        }
    });
</script>

</body>
</html>
