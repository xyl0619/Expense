<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 轻账</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
<main class="card auth-card">
    <div class="brand">
        <h1>轻账</h1>
        <p>清楚记录每一笔，轻松掌握每个月</p>
    </div>

    <div th:if="${param.error}" class="notice error show" role="alert">用户名或密码不正确</div>
    <div th:if="${param.logout}" class="notice success show" role="status">已安全退出</div>
    <div th:if="${param.registered}" class="notice success show" role="status">注册成功，请登录</div>

    <form class="auth-form" th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">登录</button>
    </form>

    <p class="auth-links">还没有账户？<a th:href="@{/register}">立即注册</a></p>
    <p class="auth-home"><a th:href="@{/}">← 返回首页</a></p>
</main>
</body>
</html>
