<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title data-i18n="admin.title">管理 · 轻账</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/i18n.js}"></script>
    <script defer th:src="@{/webjars/chart.js/4.4.7/dist/chart.umd.js}"></script>
    <script defer th:src="@{/js/common.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand"><h1 data-i18n="admin.center">管理中心</h1><p data-i18n="admin.tagline">用户与全局支出概览</p></div>
        <div class="nav-actions">
            <div th:replace="~{fragments/language :: switch}"></div>
            <a th:href="@{/dashboard}" class="btn ghost" data-i18n="nav.backDashboard">返回仪表盘</a>
            <form th:action="@{/logout}" method="post"><button class="btn ghost" type="submit" data-i18n="nav.logout">退出</button></form>
        </div>
    </div>
</header>

<main class="page">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="section-heading">
        <div><h2 data-i18n="admin.users">用户</h2><p data-i18n="admin.usersSubtitle">查看账户并删除不再需要的用户</p></div>
        <button id="refresh-admin" class="btn" type="button" data-i18n="admin.refresh">刷新</button>
    </div>
    <section class="card table-wrap">
        <table>
            <thead><tr><th>ID</th><th data-i18n="auth.username">用户名</th><th data-i18n="admin.email">邮箱</th><th data-i18n="admin.role">身份</th><th data-i18n="dashboard.action">操作</th></tr></thead>
            <tbody id="users-list"><tr><td colspan="5" class="empty" data-i18n="dashboard.loading">正在加载…</td></tr></tbody>
        </table>
    </section>

    <div class="section-heading">
        <div><h2 data-i18n="admin.allExpenses">全部支出</h2><p data-i18n="admin.expensesSubtitle">所有用户的汇总记录</p></div>
        <button id="export-admin" class="btn secondary" type="button" data-i18n="dashboard.exportCsv">导出 CSV</button>
    </div>
    <section class="card table-wrap">
        <table>
            <thead><tr><th>ID</th><th data-i18n="admin.user">用户</th><th data-i18n="dashboard.amount">金额</th><th data-i18n="dashboard.category">分类</th><th data-i18n="dashboard.date">日期</th><th data-i18n="dashboard.note">备注</th></tr></thead>
            <tbody id="report-list"><tr><td colspan="6" class="empty" data-i18n="dashboard.loading">正在加载…</td></tr></tbody>
        </table>
    </section>

    <section class="grid admin-grid admin-section">
        <article class="card chart-box"><h3 data-i18n="dashboard.categoryShare">分类占比</h3><div class="chart-canvas"><canvas id="admin-category-chart"></canvas></div></article>
        <article class="card chart-box"><h3 data-i18n="dashboard.monthlyTrend">月度趋势</h3><div class="chart-canvas"><canvas id="admin-monthly-chart"></canvas></div></article>
    </section>
</main>
</body>
</html>
