spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/expense;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwtSecret: ${JWT_SECRET:ZXhwZW5zZS10cmFja2VyLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtYmVmb3JlLXByb2R1Y3Rpb24tMg==}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
