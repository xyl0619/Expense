name: 功能建议
description: 提议一个明确、可验证的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述你希望增加的功能。一个 Issue 只讨论一个主题。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议
          required: true
        - label: 这个建议不包含密码、令牌或个人数据
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么情况下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想的操作流程、接口或界面结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果有，请说明其他可行方式以及没有采用它们的原因。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 页面与交互
        - 支出与预算
        - 管理员功能
        - API
        - 数据库
        - Docker 与部署
        - 文档与协作
        - 其他
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用简短条目说明怎样才算完成。

